# Hosting backups for peers.
#
# `docker compose up -d` is enough for a basic setup, or use
# `peerbackup host quickstart <peer>` which does this plus creating a login.
#
# By default the size limit is applied by rest-server and shared across all
# peers. Pointing PB_DATA at provisioned per-peer volumes gives each peer its
# own filesystem-enforced limit instead; see the README.

services:
  rest-server:
    image: restic/rest-server:0.14.0
    container_name: peerbackup-rest
    restart: unless-stopped

    # Match whoever owns PB_DATA on the host, or the stored files end up owned
    # by root and you cannot inspect or delete your own data without sudo.
    user: "${PB_UID:-1000}:${PB_GID:-1000}"

    ports:
      # PB_BIND exists so binding to one interface is a variable rather than an
      # edit. The default stays 0.0.0.0, because the whole point is a friend on
      # another machine reaching this -- but on a host where a reverse proxy
      # terminates TLS, set PB_BIND=127.0.0.1 and publish nothing else.
      - "${PB_BIND:-0.0.0.0}:${PB_PORT:-51515}:8000"

    environment:
      #   --private-repos  confines each login to its own subdirectory, so one
      #                    peer cannot read or write another's backups
      #   --append-only    accepts new backups, refuses deletion. Protects the
      #                    stored history if a peer's machine is compromised.
      #                    Their cleanup then needs a maintenance window; see
      #                    the README.
      #   --max-size       total bytes across all peers on this server
      OPTIONS: >-
        --private-repos
        --append-only
        --max-size ${PB_MAX_SIZE:-536870912000}
        ${PB_EXTRA_OPTIONS:-}

    volumes:
      - "${PB_DATA:-${HOME}/.local/share/peerbackup-data}:/data"
      # TLS: put fullchain.pem and privkey.pem in $PB_CERTS, uncomment the line
      # below, and set both of these:
      #   PB_CERTS=~/.local/share/peerbackup-certs
      #   PB_EXTRA_OPTIONS="--tls --tls-cert /certs/fullchain.pem --tls-key /certs/privkey.pem"
      #   PB_HEALTHCHECK_SCHEME=https
      # The certificate has to be readable by PB_UID: this container does not
      # run as root, so a key left at 0600 root:root is a key it cannot open.
      # See the README's TLS section, which has the copy-and-chown recipe.
      # - "${PB_CERTS:-./certs}:/certs:ro"

    healthcheck:
      # Any HTTP status line means the server answered, which is all "is it up"
      # should mean. Do not check for a specific code: with --private-repos, /
      # answers 401 forever, and busybox wget (this image is Alpine) exits 1 for
      # an HTTP error exactly as it does for nothing listening, so a code check
      # marks a working server permanently unhealthy. Orchestrators that route
      # on container health then drop the route without logging why.
      # The scheme follows PB_EXTRA_OPTIONS. Hardcoded to http it did not
      # break under --tls, but it passed for the wrong reason: Go answers a
      # plaintext request to a TLS port with `HTTP/1.0 400 Bad Request`, which
      # contains the status line this looks for. So the container read healthy
      # on the strength of a handshake failure, and would keep doing so with a
      # certificate the server could not load -- which is precisely the silent
      # route-drop the paragraph above is about.
      test: ["CMD-SHELL", "wget -q -S -O /dev/null -T 3 --no-check-certificate ${PB_HEALTHCHECK_SCHEME:-http}://127.0.0.1:8000/ 2>&1 | grep -q 'HTTP/'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # rest-server serves the internet in the default deployment and needs none
    # of this. `no-new-privileges` blocks setuid escalation from inside the
    # container, and the capability set it actually uses is empty: it binds
    # 8000, which is unprivileged, and writes files as PB_UID.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # A fork bomb in a compromised container should not take the host with it.
    pids_limit: 512

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
