# peerbackup peer host — the thing a friend actually runs.
#
# Three things here are easy to get wrong (see docs/runbook.md):
#
#   1. `user:` is not optional. The image runs as uid 0 and creates repositories
#      0700 root:root through the bind mount. Without this you cannot du, monitor
#      or tear down your own peer directory without sudo.
#
#   2. rest-server is configured by ENVIRONMENT, not by command arguments.
#      Putting `--append-only` in `command:` makes runc try to exec it.
#
#   3. The bind mount source must be an already-mounted quota volume. If it is
#      an ordinary directory, writes land on the host root filesystem with no
#      size limit and the first symptom is a full disk. That is what the
#      `peerbackup-host guard` ExecStartPre check exists to prevent, and why
#      this compose file is normally driven by the systemd unit rather than
#      `docker compose up` directly.

services:
  rest-server:
    image: restic/rest-server:0.14.0
    container_name: peerbackup-rest
    restart: unless-stopped

    # See note 1. Set PB_UID/PB_GID in .env, or export them before compose up.
    user: "${PB_UID:-1000}:${PB_GID:-1000}"

    ports:
      - "${PB_PORT:-8000}:8000"

    environment:
      # See note 2. Auth stays ON: the htpasswd file lives in the data dir and
      # is created with `docker exec -it peerbackup-rest create_user <peer>`.
      #
      #   --private-repos  confines each credential to /data/<username>, so one
      #                    friend cannot read or write another's repository.
      #   --append-only    new backups allowed, deletion refused. This is the
      #                    ransomware guard. Verified in the spike: prune under
      #                    this flag exits 3 with HTTP 403, backups still work.
      #                    Dropping it for a prune is a coordinated maintenance
      #                    window; see docs/runbook.md.
      #   --max-size       global backstop only. It is NOT a per-peer quota:
      #                    per-peer limits come from each grant being its own
      #                    mounted filesystem.
      OPTIONS: >-
        --private-repos
        --append-only
        ${PB_EXTRA_OPTIONS:-}

    volumes:
      # See note 3. Each child of this directory is a separate mounted image,
      # so ENOSPC lands per-peer at the kernel rather than taking out the host.
      - "${PB_ROOT:-/srv/peerbackup}/mnt:/data"

    # TLS. Generate or symlink certs here; rest-server reads them from /certs.
    # Uncomment together with the TLS options in PB_EXTRA_OPTIONS:
    #   PB_EXTRA_OPTIONS="--tls --tls-cert /certs/fullchain.pem --tls-key /certs/privkey.pem"
    # - "${PB_ROOT:-/srv/peerbackup}/certs:/certs:ro"

    healthcheck:
      # rest-server answers 404 on /, which is a healthy server refusing to list
      # the root. Any HTTP response at all means it is up.
      test: ["CMD-SHELL", "wget -q -O /dev/null -T 3 http://127.0.0.1:8000/ || [ $? -eq 8 ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
